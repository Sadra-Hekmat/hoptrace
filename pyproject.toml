[build-system]
requires = []
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "packet-odyssey-cli"
version = "0.1.0"
description = "A lightweight terminal simulator for the journey from browser to database."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Packet Odyssey contributors" }]
keywords = ["networking", "cli", "simulation", "dns", "tcp", "tls"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Education",
  "Topic :: System :: Networking",
]
dependencies = []

[project.scripts]
packet-odyssey = "packet_odyssey.cli:entrypoint"

